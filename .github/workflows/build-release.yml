name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    
    # 安装 MinGW-w64
    - name: Install MinGW-w64
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64
    
    # 修复头文件大小写问题
    - name: Fix include case
      run: |
        cd ConsoleApplication8
        # 自动将 Windows.h 替换为 windows.h
        sed -i 's/#include <Windows.h>/#include <windows.h>/g' ConsoleApplication8.cpp
        # 验证修改
        grep -n "#include <windows.h" ConsoleApplication8.cpp
    
    # 编译
    - name: Build Executable
      run: |
        cd ConsoleApplication8
        x86_64-w64-mingw32-g++ -std=c++11 ConsoleApplication8.cpp -o Tetris.exe \
          -static \
          -static-libgcc \
          -static-libstdc++ \
          -O2 \
          -s \
          -lwinmm \
          -lgdi32
        # -lwinmm: 链接 Windows 多媒体库（如果需要）
        # -lgdi32: 链接图形设备接口库
    
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Version ${{ github.event.inputs.version }}
        files: ConsoleApplication8/Tetris.exe
        make_latest: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
