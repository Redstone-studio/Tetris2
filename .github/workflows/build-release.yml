name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest  # 或 windows-latest 都行
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    
    # MinGW 编译（完全静态，支持所有 Windows）
    - name: Build with MinGW
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
        
        cd ConsoleApplication8
        x86_64-w64-mingw32-g++ -std=c++11 ConsoleApplication8.cpp -o ConsoleApplication8.exe \
          -static \
          -O2 \
          -s
    
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Version ${{ github.event.inputs.version }}
        files: ConsoleApplication8/ConsoleApplication8.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
