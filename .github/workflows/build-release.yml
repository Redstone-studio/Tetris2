name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.0'

jobs:
  build:
    # 尝试多个 Windows 版本，哪个快用哪个
    runs-on: windows-latest
    
    # 添加超时限制，避免无限等待
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Project
      run: |
        msbuild ConsoleApplication8\ConsoleApplication8.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Version ${{ github.event.inputs.version }}
        files: ConsoleApplication8\x64\Release\ConsoleApplication8.exe
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
